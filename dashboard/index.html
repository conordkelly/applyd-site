:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #E8ECF1;
  --text: #12151B;
  --text-2: #525964;
  --text-3: #868D98;
  --accent: #1D5FD1;
  --accent-ink: #F5F9FF;
  --signal: #2F8F5B;
  --hairline: rgba(18,21,27,0.10);
  --hairline-strong: rgba(18,21,27,0.20);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0C10;
    --surface: #12151B;
    --surface-2: #191D25;
    --text: #EDEFF3;
    --text-2: #98A0AC;
    --text-3: #5B6270;
    --accent: #4C8DFF;
    --accent-ink: #071223;
    --signal: #6DBF8B;
    --hairline: rgba(237,239,243,0.09);
    --hairline-strong: rgba(237,239,243,0.18);
  }
}

:root[data-theme="dark"] {
  --bg: #0A0C10;
  --surface: #12151B;
  --surface-2: #191D25;
  --text: #EDEFF3;
  --text-2: #98A0AC;
  --text-3: #5B6270;
  --accent: #4C8DFF;
  --accent-ink: #071223;
  --signal: #6DBF8B;
  --hairline: rgba(237,239,243,0.09);
  --hairline-strong: rgba(237,239,243,0.18);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

body {
  font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.mono {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

.page {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 32px 80px;
}

/* topbar */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0;
  border-bottom: 1px solid var(--hairline);
}

.brandmark {
  display: flex;
  align-items: center;
  gap: 10px;
}

.wordmark {
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 700;
  font-size: 24px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.wordmark span { color: var(--accent); }

#user-button { display: flex; align-items: center; }

.signed-out-note {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-2);
}

/* tabs */

.tabs {
  display: flex;
  gap: 8px;
  padding: 28px 0 0;
}

.tab-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-2);
  background: none;
  border: 1px solid var(--hairline-strong);
  border-radius: 6px 6px 0 0;
  padding: 12px 18px;
  cursor: pointer;
  border-bottom: none;
}

.tab-btn.active {
  color: var(--accent);
  background: var(--surface);
  border-color: var(--hairline-strong);
}

.tab-panel {
  display: none;
  border: 1px solid var(--hairline-strong);
  border-radius: 0 8px 8px 8px;
  background: var(--surface);
  padding: 28px;
  min-height: 320px;
}

.tab-panel.active { display: block; }

.panel-head h2 {
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 700;
  font-size: 24px;
  text-transform: uppercase;
  margin: 0 0 6px;
}

.panel-head p {
  font-size: 14px;
  color: var(--text-2);
  margin: 0 0 24px;
  max-width: 60ch;
}

/* excel-style grid */

.grid-wrap {
  border: 1px solid var(--hairline-strong);
  border-radius: 4px;
  overflow: hidden;
}

table.grid {
  width: 100%;
  border-collapse: collapse;
}

table.grid th {
  background: var(--surface-2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-2);
  text-align: left;
  padding: 9px 12px;
  border-bottom: 1px solid var(--hairline-strong);
  border-right: 1px solid var(--hairline);
}

table.grid th.row-num-col, table.grid td.row-num-cell {
  width: 44px;
  text-align: center;
}

table.grid td {
  border-bottom: 1px solid var(--hairline);
  border-right: 1px solid var(--hairline);
  padding: 0;
}

table.grid td.row-num-cell {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-3);
  text-align: center;
  background: var(--surface-2);
}

table.grid input[type="text"] {
  width: 100%;
  border: none;
  background: transparent;
  padding: 10px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text);
}

table.grid input[type="text"]:focus {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.grid-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 16px;
}

.add-row-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  color: var(--accent);
  background: none;
  border: 1px solid var(--hairline-strong);
  border-radius: 6px;
  padding: 9px 14px;
  cursor: pointer;
}

.submit-btn {
  font-family: 'Hanken Grotesk', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--accent-ink);
  background: var(--accent);
  border: none;
  border-radius: 6px;
  padding: 12px 22px;
  cursor: pointer;
}

.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.submit-note {
  font-size: 12.5px;
  margin-top: 14px;
}

.submit-note.ok { color: var(--signal); }
.submit-note.err { color: var(--accent); }

/* processing / completed lists */

table.list {
  width: 100%;
  border-collapse: collapse;
}

table.list th {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-2);
  text-align: left;
  padding: 10px 4px;
  border-bottom: 1px solid var(--hairline-strong);
}

table.list td {
  padding: 12px 4px;
  border-bottom: 1px solid var(--hairline);
  font-size: 13.5px;
}

table.list td.link-cell {
  max-width: 480px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

table.list td.date-cell {
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-2);
  white-space: nowrap;
}

.status-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.05em;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--hairline-strong);
  color: var(--text-2);
}

.status-chip.completed { color: var(--signal); border-color: var(--signal); }

.empty-state {
  font-size: 14px;
  color: var(--text-3);
  padding: 40px 0;
  text-align: center;
}
</style>

<div class="page">
  <header class="topbar">
    <div class="brandmark">
      <svg width="26" height="26" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M40 172 L100 32 L160 172" stroke="var(--text)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M70 118 L90 138 L124 96" stroke="var(--accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="wordmark">Appl<span>y</span>d</div>
    </div>
    <div id="user-button"></div>
  </header>

  <div id="signed-out-view" style="display:none; padding:60px 0;">
    <div id="sign-in"></div>
  </div>

  <div id="app-view" style="display:none;">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="submission">Jobs Submission</button>
      <button class="tab-btn" data-tab="processing">Jobs Processing</button>
      <button class="tab-btn" data-tab="completed">Jobs Completed</button>
    </nav>

    <section class="tab-panel active" id="panel-submission">
      <div class="panel-head">
        <h2>Jobs Submission</h2>
        <p>Paste a link to each job posting you want to apply to. Add rows as you need, then submit — they'll move to Jobs Processing.</p>
      </div>
      <div class="grid-wrap">
        <table class="grid">
          <thead>
            <tr><th class="row-num-col"></th><th>Job Link</th></tr>
          </thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>
      <div class="grid-actions">
        <button class="add-row-btn" id="add-row-btn">+ Add row</button>
        <button class="submit-btn" id="submit-btn">Submit</button>
      </div>
      <p class="submit-note" id="submit-note" style="display:none;"></p>
    </section>

    <section class="tab-panel" id="panel-processing">
      <div class="panel-head">
        <h2>Jobs Processing</h2>
        <p>Submitted and being worked on.</p>
      </div>
      <div id="processing-content"></div>
    </section>

    <section class="tab-panel" id="panel-completed">
      <div class="panel-head">
        <h2>Jobs Completed</h2>
        <p>Applications that have gone all the way through.</p>
      </div>
      <div id="completed-content"></div>
    </section>
  </div>
</div>

<script>
(function () {
  var gridBody = document.getElementById('grid-body');
  var ROW_MIN = 6;

  function addRow() {
    var tr = document.createElement('tr');
    var n = gridBody.children.length + 1;
    tr.innerHTML =
      '<td class="row-num-cell">' + n + '</td>' +
      '<td><input type="text" placeholder="https://..." /></td>';
    gridBody.appendChild(tr);
  }

  for (var i = 0; i < ROW_MIN; i++) addRow();
  document.getElementById('add-row-btn').addEventListener('click', addRow);

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'processing') loadJobs();
      if (btn.dataset.tab === 'completed') loadJobs();
    });
  });

  async function getToken() {
    return window.Clerk.session ? window.Clerk.session.getToken() : null;
  }

  async function apiFetch(path, options) {
    var token = await getToken();
    options = options || {};
    options.headers = Object.assign({}, options.headers, {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    });
    var res = await fetch(path, options);
    if (!res.ok) throw new Error('Request failed');
    return res.json();
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderList(container, rows, dateField, dateLabel) {
    if (!rows.length) {
      container.innerHTML = '<div class="empty-state">Nothing here yet.</div>';
      return;
    }
    var html = '<table class="list"><thead><tr><th>Job Link</th><th>' + dateLabel + '</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr><td class="link-cell"><a href="' + escapeHtml(r.job_url) + '" target="_blank" rel="noopener">' + escapeHtml(r.job_url) + '</a></td>' +
        '<td class="date-cell">' + escapeHtml((r[dateField] || '').replace('T', ' ').slice(0, 16)) + '</td></tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  async function loadJobs() {
    try {
      var data = await apiFetch('/api/dashboard/jobs');
      renderList(document.getElementById('processing-content'), data.processing, 'created_at', 'Submitted');
      renderList(document.getElementById('completed-content'), data.completed, 'completed_at', 'Date Submitted');
    } catch (e) {
      console.error(e);
    }
  }

  document.getElementById('submit-btn').addEventListener('click', async function () {
    var inputs = gridBody.querySelectorAll('input[type="text"]');
    var links = Array.prototype.map.call(inputs, function (i) { return i.value.trim(); }).filter(Boolean);
    var note = document.getElementById('submit-note');
    var btn = document.getElementById('submit-btn');

    if (!links.length) {
      note.textContent = 'Paste at least one link first.';
      note.className = 'submit-note err';
      note.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      var res = await apiFetch('/api/dashboard/jobs', {
        method: 'POST',
        body: JSON.stringify({ links: links })
      });
      note.textContent = 'Submitted ' + res.submitted + ' role(s) — moved to Jobs Processing.';
      note.className = 'submit-note ok';
      note.style.display = 'block';
      gridBody.innerHTML = '';
      for (var i = 0; i < ROW_MIN; i++) addRow();
    } catch (e) {
      note.textContent = 'Something went wrong — try again in a moment.';
      note.className = 'submit-note err';
      note.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit';
    }
  });

  window.addEventListener('load', async function () {
    if (!window.Clerk) {
      console.error('Clerk failed to load — check the publishable key / frontend API domain in dashboard/index.html');
      return;
    }
    await window.Clerk.load();

    if (window.Clerk.isSignedIn) {
      document.getElementById('signed-out-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'block';
      window.Clerk.mountUserButton(document.getElementById('user-button'));
      loadJobs();
    } else {
      document.getElementById('app-view').style.display = 'none';
      document.getElementById('signed-out-view').style.display = 'block';
      window.Clerk.mountSignIn(document.getElementById('sign-in'));
    }
  });
})();
</script>
